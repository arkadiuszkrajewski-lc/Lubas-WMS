<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LUBAS WMS v5.30</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  
  <script type="text/javascript">
    var ZebraBrowserPrint = function() {
      function e(e, t) { var n = new XMLHttpRequest; return "withCredentials" in n ? n.open(e, t, !0) : "undefined" != typeof XDomainRequest ? (n = new XDomainRequest, n.open(e, t)) : n = null, n }
      function t(t, n, o, r) { var i = e(t, n); return i ? (i.onload = function() { if (200 === i.status) o(i.responseText); else { var e = i.responseText; try { e = JSON.parse(i.responseText) } catch (t) {} r(e) } }, i.onerror = function() { r(i.responseText) }, i) : void r("CORS not supported") }
      var n = {}, o = "https://localhost:9101/"; return n.getLocalDevices = function(e, n, o) { var r = t("GET", "https://localhost:9101/available", function(t) { try { var o = JSON.parse(t); e(o) } catch (r) { n(r) } }, n); r && r.send() }, n.getDefaultDevice = function(e, o, r) { var i = t("GET", "https://localhost:9101/default", function(t) { try { var r = JSON.parse(t); o(r) } catch (i) { r(i) } }, r); i && i.send() }, n.sendThroughPrintService = function(e, n, i, s) { var a = t("POST", o + "write", i, s); a && a.send(JSON.stringify({ device: n, data: e })) }, n
    }();
  </script>
  
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-dark: #1e293b;
      --accent-blue: #3b82f6;
      --accent-danger: #ef4444;
      --accent-success: #10b981;
      --accent-purple: #a855f7;
      --text-main: #f8fafc;
    }
    body { background-color: var(--bg-dark); color: var(--text-main); font-family: 'Inter', sans-serif; -webkit-user-select: none; user-select: none; line-height: 1.6; }
    .modern-card { background: var(--card-dark); border-radius: 20px; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 10px 30px rgba(0,0,0,0.3); margin-bottom: 30px; padding: 22px !important; }
    .SkanerOkno { background: #000; border-radius: 16px; overflow: hidden; width: 100%; margin: 0 auto; display: none; aspect-ratio: 4/3; border: 2px solid rgba(255,255,255,0.15); margin-bottom: 30px; position: relative; }
    .SkanerOkno video { width: 100%; height: 100%; object-fit: cover; }
    .wielki-input { font-size: 1.15rem; padding: 16px; background-color: #0f172a !important; color: #fff !important; border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; }
    .wielki-input:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3); }
    .skan-aktywny { border: 2px solid var(--accent-danger) !important; box-shadow: 0 0 18px rgba(239, 68, 68, 0.35) !important; }
    .btn-modern { border-radius: 14px; padding: 16px; font-weight: 700; transition: all 0.2s; letter-spacing: 0.5px; }
    
    .glowny-przelacznik-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
    .glowny-przelacznik-grid .btn-check:checked + .btn { background-color: var(--accent-blue); border-color: var(--accent-blue); color: white; box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35); }
    .glowny-przelacznik-grid .btn { font-size: 0.82rem; letter-spacing: 0.5px; padding: 14px 6px; font-weight: 800; border-color: rgba(255,255,255,0.15); color: #94a3b8; border-radius: 12px !important; text-transform: uppercase; }
    
    .mini-przelacznik .btn-check:checked + .btn { background-color: var(--accent-blue); border-color: var(--accent-blue); color: #fff; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }
    .mini-przelacznik .btn { font-size: 0.85rem; font-weight: 700; color: #a6b5cc; border-color: rgba(255,255,255,0.15); border-radius: 10px !important; padding: 12px; }

    .form-group-custom { margin-bottom: 25px; }
    .label-custom { font-size: 0.92rem; letter-spacing: 0.5px; margin-bottom: 12px; display: block; }
    #login-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg-dark); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .login-scanner-box { background: #000; border-radius: 12px; overflow: hidden; width: 100%; max-width: 280px; display: none; aspect-ratio: 1/1; margin-bottom: 25px; border: 2px solid var(--accent-blue); position: relative; }
    .login-scanner-box video { width: 100%; height: 100%; object-fit: cover; }
    
    .naglowek-operatora { display: flex; justify-content: space-between; align-items: center; gap: 15px; flex-wrap: wrap; width: 100%; padding-bottom: 15px; margin-bottom: 15px; }
  </style>
</head>
<body>

<div id="login-overlay">
  <div class="text-center p-4 modern-card" style="max-width: 420px; width: 100%;">
    <h3 class="fw-bold mb-2">LUBAS <span class="text-primary">WMS</span></h3>
    <p class="text-muted small mb-4">Zaloguj się swoimi danymi z bazy</p>
    
    <div id="login-reader" class="login-scanner-box mx-auto"></div>

    <div class="text-start">
      <div class="form-group-custom">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <label class="label-custom text-secondary fw-bold m-0">Email:</label>
          <button id="btn-toggle-login-scan" onclick="odpalSkanerLogowania()" class="btn btn-sm btn-outline-info py-1 px-2" style="font-size:0.75rem;">📷 Skanuj kartę</button>
        </div>
        <input type="email" id="auth-email" class="form-control wielki-input text-lowercase" placeholder="Wpisz lub zeskanuj e-mail">
      </div>
      
      <div class="form-group-custom">
        <label class="label-custom text-secondary fw-bold mb-2">Hasło:</label>
        <div class="input-group">
          <input type="password" id="auth-password" class="form-control wielki-input" placeholder="Wpisz hasło dostępu">
          <button class="btn btn-outline-secondary px-3" type="button" onclick="przelaczWidokHasla()" style="border-top-right-radius: 12px; border-bottom-right-radius: 12px; border-color: rgba(255,255,255,0.15); background: #0f172a; color: #94a3b8;">👁️</button>
        </div>
      </div>
    </div>
    
    <button id="btn-login-submit" onclick="autoryzujZBazą()" class="btn btn-primary w-100 btn-modern fs-5 mt-4">Zaloguj do systemu</button>
  </div>
</div>

<div class="container py-3" style="max-width: 480px;">
  <div class="naglowek-operatora">
    <h4 class="fw-bold m-0">LUBAS WMS <span class="text-info fw-bold" style="font-size:0.9rem;">v5.30</span></h4>
    <div class="d-flex align-items-center gap-2">
      <span class="small text-secondary fw-bold">Operator:</span>
      <span id="user-badge" class="badge bg-success p-2" style="font-size: 0.75rem;">---</span>
      <button onclick="wylogujOperatora()" class="btn btn-sm btn-outline-secondary py-1 px-2" style="font-size: 0.75rem;">Zmień</button>
    </div>
  </div>

  <div class="modern-card p-3 mb-4">
    <div class="glowny-przelacznik-grid mb-3">
      <div>
        <input type="radio" class="btn-check" name="main-nav" id="tab-wydanie-osoba" checked onclick="przelaczGlownyModul('Wydanie Osoba')">
        <label class="btn btn-outline-light w-100" for="tab-wydanie-osoba">🔴 WYDANIE (OSOBA)</label>
      </div>
      <div>
        <input type="radio" class="btn-check" name="main-nav" id="tab-wydanie-regal" onclick="przelaczGlownyModul('Wydanie Regał')">
        <label class="btn btn-outline-light w-100" for="tab-wydanie-regal">📦 WYDANIE (REGAŁ)</label>
      </div>
    </div>
    <div class="glowny-przelacznik-grid mb-3">
      <div>
        <input type="radio" class="btn-check" name="main-nav" id="tab-przyjecie" onclick="przelaczGlownyModul('Przyjęcie')">
        <label class="btn btn-outline-light w-100" for="tab-przyjecie">🟢 PRZYJĘCIE</label>
      </div>
      <div>
        <input type="radio" class="btn-check" name="main-nav" id="tab-przesuniecie" onclick="przelaczGlownyModul('Przesunięcie')">
        <label class="btn btn-outline-light w-100" for="tab-przesuniecie">🟡 PRZESUNIĘCIE</label>
      </div>
    </div>
    <div>
      <input type="radio" class="btn-check" name="main-nav" id="tab-wydruki" onclick="przelaczGlownyModul('Wydruki')">
      <label class="btn btn-outline-light w-100" for="tab-wydruki">🖨️ PANEL WYDRUKÓW</label>
    </div>
  </div>

  <div id="instrukcja-skanu" class="alert alert-warning text-center fw-bold small d-none" style="border-radius:12px;">Skieruj aparat na kod QR...</div>
  <button id="btn-torch" type="button" onclick="przelaczLatarke()" class="btn btn-warning w-100 mb-3 fw-bold d-none" style="border-radius: 12px; padding: 12px;">🔦 Włącz latarkę</button>
  <div id="reader" class="SkanerOkno"></div>

  <!-- SEKCJA OPERACJI SKANOWANIA -->
  <div id="sekcja-operacji" class="card modern-card p-3 shadow-sm border-0">
    <form id="wmsForm" onsubmit="wyslijDane(event)">
      <input type="hidden" id="operacja" value="Wydanie Osoba">
      <input type="hidden" id="aktywne-pole" value="">

      <div class="form-group-custom">
        <label class="form-label fw-bold small text-secondary mb-2">1. KOD TOWARU:</label>
        <div class="input-group">
          <input type="text" id="kod-towaru" class="form-control wielki-input text-uppercase" placeholder="Format: litera + 5 cyfr (np. A12345)" onclick="aktywujSkanowanie('kod-towaru')" required>
          <button class="btn btn-outline-danger" type="button" onclick="wyczyscPole('kod-towaru')">❌</button>
        </div>
      </div>

      <div class="form-group-custom" id="sekcja-polka-z">
        <label id="label-polka-z" class="form-label fw-bold small text-secondary mb-2">2. ADRES PÓŁKI (ŹRÓDŁOWA):</label>
        <div class="input-group">
          <input type="text" id="polka" class="form-control wielki-input text-uppercase" placeholder="Format: 00-00-00-A-00" onclick="aktywujSkanowanie('polka')" required>
          <button class="btn btn-outline-danger" type="button" onclick="wyczyscPole('polka')">❌</button>
        </div>
      </div>

      <div class="form-group-custom" id="sekcja-polka-do" style="display: none;">
        <label id="label-polka-do" class="form-label fw-bold small text-secondary mb-2">2b. PÓŁKA DOCELOWA:</label>
        <div class="input-group">
          <input type="text" id="polka-do" class="form-control wielki-input text-uppercase" placeholder="Format: 00-00-00-A-00" onclick="aktywujSkanowanie('polka-do')">
          <button class="btn btn-outline-danger" type="button" onclick="wyczyscPole('polka-do')">❌</button>
        </div>
      </div>

      <div class="form-group-custom" id="sekcja-lista-stref" style="display: none;">
        <label class="form-label fw-bold small text-secondary mb-2">2b. WYBIERZ REGAŁ DOCELOWY:</label>
        <select id="strefa-select" class="form-select wielki-input text-white" onchange="schowajAparat()">
          <option value="" disabled selected>-- Wybierz regał / dział --</option>
          <option value="Odlewnia ogólna">Odlewnia ogólna</option>
          <option value="Ślusarnia ogólna">Ślusarnia ogólna</option>
          <option value="Odlewnia sita">Odlewnia sita</option>
          <option value="Ślusarnia sita">Ślusarnia sita</option>
          <option value="Obróbka Mechaniczna">Obróbka Mechaniczna</option>
          <option value="Magazyn wyrobów gotowych">Magazyn wyrobów gotowych</option>
          <option value="Nowa hala">Nowa hala</option>
          <option value="Pierścienie">Pierścienie</option>
        </select>
      </div>

      <div class="form-group-custom" id="sekcja-pracownik">
        <label class="form-label fw-bold small text-secondary mb-2">3. PRACOWNIK (Imię i Nazwisko):</label>
        <div class="input-group">
          <input type="text" id="pracownik" class="form-control wielki-input" placeholder="Wpisz lub skanuj pełne Imię i Nazwisko" onclick="aktywujSkanowanie('pracownik')">
          <button class="btn btn-outline-danger" type="button" onclick="wyczyscPole('pracownik')">❌</button>
        </div>
      </div>

      <div class="form-group-custom">
        <label class="form-label fw-bold small text-secondary mb-2">4. ILOŚĆ SZTUK:</label>
        <input type="number" id="ilosc" class="form-control wielki-input" value="1" min="1" placeholder="Wpisz ilość sztuk" required onfocus="schowajAparat()">
      </div>

      <button type="submit" id="btn-submit" class="btn btn-primary w-100 py-3 fw-bold fs-5 btn-modern mt-2">ZAPISZ OPERACJĘ (Enter)</button>
    </form>
    <div id="status" class="alert alert-success mt-3 d-none text-center fw-bold" style="border-radius:12px;"></div>
  </div>

  <!-- SEKCJA PANELU WYDRUKÓW -->
  <div id="sekcja-druku" class="modern-card p-3" style="display: none; border: 1px solid rgba(59, 130, 246, 0.3);">
    
    <div class="p-3 mb-4 rounded-3" style="background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.12);">
      <div class="form-check form-switch d-flex align-items-center justify-content-between p-0">
        <label class="form-check-label fw-bold text-info" for="check-agent-usb" style="cursor: pointer;">
          🖨️ STACJA DRUKUJĄCA (USB Zebra)
          <div class="small text-muted fw-normal mt-1">Zaznacz TYLKO na komputerze z wpiętą drukarką Zebra</div>
        </label>
        <input class="form-check-input ms-2" type="checkbox" id="check-agent-usb" style="transform: scale(1.4); cursor: pointer;" onchange="zapiszStanAgenta(this.checked)">
      </div>
      <div id="agent-status-badge" class="small mt-2 fw-bold text-secondary">Status: Nasłuchiwanie wyłączone</div>
    </div>

    <div class="btn-group w-100 mb-4 mini-przelacznik" role="group">
      <input type="radio" class="btn-check" name="sub-print" id="sub-user" checked onclick="przelaczPodpanelDruku('user')">
      <label class="btn btn-outline-secondary py-2 fw-bold" for="sub-user">🪪 Pracownik</label>
      
      <input type="radio" class="btn-check" name="sub-print" id="sub-duplikat" onclick="przelaczPodpanelDruku('duplikat')">
      <label class="btn btn-outline-secondary py-2 fw-bold" for="sub-duplikat">📋 Duplikat Etykiety</label>
    </div>

    <div id="sub-panel-user">
      <div class="form-group-custom">
        <label class="small text-secondary fw-bold mb-2">IMIĘ I NAZWISKO PRACOWNIKA:</label>
        <input type="text" id="p-user-nazwa" class="form-control wielki-input" placeholder="Wpisz Imię i Nazwisko">
      </div>
      <button type="button" onclick="drukujEtykietePracownika()" class="btn btn-success w-100 py-3 fw-bold btn-modern mt-2">Drukuj Identyfikator (QR)</button>
    </div>

    <div id="sub-panel-duplikat" style="display: none;">
      <div class="form-group-custom">
        <label class="small text-secondary fw-bold mb-2">ZESKANUJ LUB WPISZ KOD ETYKIETY:</label>
        <div class="input-group">
          <input type="text" id="p-duplikat-kod" class="form-control wielki-input text-uppercase" placeholder="Skanuj towar, półkę lub pracownika" onclick="aktywujSkanowanie('p-duplikat-kod')">
          <button class="btn btn-outline-danger" type="button" onclick="wyczyscPole('p-duplikat-kod')">❌</button>
        </div>
        <div class="small text-muted mt-2">Pobiera pełną nazwę towaru z BigQuery (`Nazwa_WMS`) przy skanowaniu towaru.</div>
      </div>
      <button type="button" id="btn-duplikat-submit" onclick="drukujDuplikatEtykiety()" class="btn btn-warning w-100 py-3 fw-bold btn-modern text-dark mt-2">Drukuj Duplikat Etykiety</button>
    </div>

  </div>

</div>

<script>
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbykKaTjGfb4H-S-AUUIIMr8g62hAE1V0YWYDhssCbAh26Y9r0u96xVySApf01PqO9sZ0Q/exec";
  
  let html5Qrcode = null;
  let loginQrcode = null;
  let blokadaSkanera = false; 
  let zalogowanyUzytkownik = "";

  let activeStream = null;
  let activeVideoElement = null;
  let scanInterval = null;
  const hasNativeBarcodeDetector = ('BarcodeDetector' in window);

  let printLoopInterval = null;

  window.onload = function() {
    const zapamietanyEmail = localStorage.getItem('wms_user_email');
    const zapamietanaNazwa = localStorage.getItem('wms_user_name');
    if (zapamietanyEmail && zapamietanaNazwa) {
      zalogowanyUzytkownik = zapamietanyEmail;
      document.getElementById('user-badge').innerText = zapamietanaNazwa;
      document.getElementById('login-overlay').style.display = 'none';
      setTimeout(() => { aktywujSkanowanie('kod-towaru'); }, 600);
    }

    const stanAgenta = localStorage.getItem('wms_agent_usb') === 'true';
    const chk = document.getElementById('check-agent-usb');
    if(chk) {
      chk.checked = stanAgenta;
      zapiszStanAgenta(stanAgenta);
    }
  };

  function zapiszStanAgenta(wlaczony) {
    localStorage.setItem('wms_agent_usb', wlaczony);
    const badge = document.getElementById('agent-status-badge');
    if (wlaczony) {
      if(badge) { badge.innerText = "Status: 🟢 NASŁUCHIWANIE AKTYWNE (Drukuję z chmury)"; badge.className = "small mt-2 fw-bold text-success"; }
      uruchomNasluchiwanieKolejki();
    } else {
      if(badge) { badge.innerText = "Status: ⚪ Nasłuchiwanie wyłączone"; badge.className = "small mt-2 fw-bold text-secondary"; }
      if (printLoopInterval) clearInterval(printLoopInterval);
    }
  }

  function uruchomNasluchiwanieKolejki() {
    if (printLoopInterval) clearInterval(printLoopInterval);
    printLoopInterval = setInterval(() => {
      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ akcja: "pobierz_kolejke" }).toString()
      })
      .then(res => res.json())
      .then(data => {
        if (data && data.zpl && data.zpl.length > 5) {
          wyslijDoBezposredniejZebry(data.zpl);
        }
      })
      .catch(e => console.warn("Błąd sprawdzania kolejki:", e));
    }, 1200);
  }

  function przelaczGlownyModul(modul) {
    schowajAparat();
    const sekcjaOperacji = document.getElementById('sekcja-operacji');
    const sekcjaDruku = document.getElementById('sekcja-druku');
    
    if (modul === 'Wydruki') {
      sekcjaOperacji.style.display = 'none';
      sekcjaDruku.style.display = 'block';
    } else {
      sekcjaOperacji.style.display = 'block';
      sekcjaDruku.style.display = 'none';
      ustawTryb(modul);
    }
  }

  function przelaczPodpanelDruku(typ) {
    document.getElementById('sub-panel-user').style.display = (typ === 'user') ? 'block' : 'none';
    document.getElementById('sub-panel-duplikat').style.display = (typ === 'duplikat') ? 'block' : 'none';
    schowajAparat();
  }

  function wyslijDoBezposredniejZebry(zplKod) {
    if (typeof ZebraBrowserPrint !== 'undefined') {
      ZebraBrowserPrint.getLocalDevices(function(lista) {
        let urzadzenie = null;
        if (lista && lista.printer && lista.printer.length > 0) urzadzenie = lista.printer[0];
        if (urzadzenie) {
          ZebraBrowserPrint.sendThroughPrintService(zplKod, urzadzenie, function() {}, function(e) { console.error(e); });
        } else {
          ZebraBrowserPrint.getDefaultDevice("printer", function(domyslne) {
            if(domyslne && domyslne.name) {
              ZebraBrowserPrint.sendThroughPrintService(zplKod, domyslne, function() {}, function(e) { console.error(e); });
            }
          }, function(err) {});
        }
      }, function(err) {});
    }
  }

  function przetworzIZlecdruk(zpl) {
    const jestStacjaUsb = localStorage.getItem('wms_agent_usb') === 'true';

    if (jestStacjaUsb) {
      wyslijDoBezposredniejZebry(zpl);
      alert("Wydrukowano pomyślnie.");
    } else {
      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ akcja: "dodaj_do_kolejki", zpl: zpl }).toString()
      })
      .then(res => res.json())
      .then(data => {
        if(data.status === "SUCCESS") {
          alert("🚀 Wysłano zlecenie do drukarki Zebra!");
        } else { alert("Błąd wysyłania do kolejki."); }
      })
      .catch(err => alert("Błąd połączenia z chmurą."));
    }
  }

  function drukujEtykietePracownika() {
    let dane = document.getElementById('p-user-nazwa').value.trim();
    if(!dane) { alert("Wpisz dane pracownika!"); return; }
    let pelneDane = dane.replace(/\s+/g, ' ');
    
    let zpl = "^XA^CI28" +
              "^FO20,40^BQN,2,4^FDQA," + pelneDane + "^FS" + 
              "^FO145,40^A0N,22,20^FDPRACOWNIK:^FS" +
              "^FO145,70^A0N,30,26^FB190,2,4,L^FD" + pelneDane + "^FS" +
              "^FO340,55^A0N,100,80^FDP^FS" + 
              "^XZ";

    przetworzIZlecdruk(zpl);
    document.getElementById('p-user-nazwa').value = "";
  }

  // AUTO-DETEKCJA ORAZ DOCIĄGANIE NAZWY Z BQ DLA TOWARU
  function drukujDuplikatEtykiety() {
    let kod = document.getElementById('p-duplikat-kod').value.trim().toUpperCase();
    if(!kod) { alert("Skanuj lub wpisz kod!"); return; }

    let polkaRegex = /^\d{2}-\d{2}-\d{2}-[A-Za-z]-\d{2}$/;
    let towarRegex = /^[A-Za-z]\d{5}$/; 

    if (polkaRegex.test(kod)) {
      // PÓŁKA / LOKALIZACJA
      let czesci = kod.split('-');
      let m = czesci[0] || "--";
      let r = czesci[1] || "--";
      let reg = czesci[2] || "--";
      let p = czesci[3] || "--";
      let poz = czesci[4] || "--";

      let zpl = "^XA^CI28" +
                "^FO20,60^BQN,2,4^FDQA," + kod + "^FS" +
                "^FO150,45^A0N,32,30^FD" + kod + "^FS" +
                "^FO150,85^GB160,1,1^FS" +
                "^FO150,100^A0N,24,22^FDMAG: " + m + " RZAD: " + r + "^FS" +
                "^FO150,130^A0N,24,22^FDREGAL: " + reg + " POZ: " + p + "^FS" +
                "^FO150,160^A0N,24,22^FDPOZYCJA: " + poz + "^FS" +
                "^FO330,120^A0N,110,90^FDL^FS" +
                "^XZ";
      przetworzIZlecdruk(zpl);
      document.getElementById('p-duplikat-kod').value = "";

    } else if (towarRegex.test(kod)) {
      // TOWAR - POBIERAMY Nazwa_WMS Z BIGQUERY
      const btn = document.getElementById('btn-duplikat-submit');
      btn.disabled = true;
      btn.innerText = "Pobieranie nazwy z BQ...";

      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ akcja: "pobierz_nazwe_towaru", kod_towaru: kod }).toString()
      })
      .then(res => res.json())
      .then(data => {
        btn.disabled = false;
        btn.innerText = "Drukuj Duplikat Etykiety";

        let pobranaNazwa = (data && data.nazwa && data.nazwa.length > 0) ? data.nazwa : kod;
        let czystaNazwa = pobranaNazwa.replace(/\s+/g, ' '); 
        let skroconaNazwa = czystaNazwa.length > 14 ? czystaNazwa.substring(0, 11) + "..." : czystaNazwa;

        let zpl = "^XA^CI28" +
                  "^FO20,60^BQN,2,4^FDQA," + kod + "^FS" + 
                  "^FO150,50^A0N,18,16^FDKOD TOWARU:^FS" +
                  "^FO150,75^A0N,28,26^FD" + kod + "^FS" +
                  "^FO150,115^A0N,18,16^FDNAZWA:^FS" +
                  "^FO150,140^A0N,26,24^FB240,3,,L^FD" + skroconaNazwa + "^FS" +
                  "^FO330,30^A0N,110,90^FDT^FS" + 
                  "^XZ";

        przetworzIZlecdruk(zpl);
        document.getElementById('p-duplikat-kod').value = "";
      })
      .catch(err => {
        btn.disabled = false;
        btn.innerText = "Drukuj Duplikat Etykiety";
        alert("Błąd połączenia z BQ. Drukuję z samym kodem.");
        
        let zpl = "^XA^CI28^FO20,60^BQN,2,4^FDQA," + kod + "^FS^FO150,50^A0N,18,16^FDKOD TOWARU:^FS^FO150,75^A0N,28,26^FD" + kod + "^FS^FO330,30^A0N,110,90^FDT^FS^XZ";
        przetworzIZlecdruk(zpl);
        document.getElementById('p-duplikat-kod').value = "";
      });

    } else {
      // PRACOWNIK / INNE
      let pelneDane = kod.replace(/\s+/g, ' ');
      let zpl = "^XA^CI28" +
                "^FO20,40^BQN,2,4^FDQA," + pelneDane + "^FS" + 
                "^FO145,40^A0N,22,20^FDIDENTYFIKATOR:^FS" +
                "^FO145,70^A0N,30,26^FB190,2,4,L^FD" + pelneDane + "^FS" +
                "^FO340,55^A0N,100,80^FDP^FS" + 
                "^XZ";
      przetworzIZlecdruk(zpl);
      document.getElementById('p-duplikat-kod').value = "";
    }
  }

  function przelaczWidokHasla() {
    const passInput = document.getElementById('auth-password');
    passInput.type = passInput.type === "password" ? "text" : "password";
  }

  let torchState = false;

  async function przelaczLatarke() {
    let track = null;
    if (activeStream && activeStream.getVideoTracks().length > 0) {
      track = activeStream.getVideoTracks()[0];
    } else if (html5Qrcode && html5Qrcode.isScanning) {
      try {
        const capabilities = html5Qrcode.getRunningTrackCapabilities();
        if (capabilities && capabilities.torch) {
          torchState = !torchState;
          await html5Qrcode.applyVideoConstraints({ advanced: [{ torch: torchState }] });
          zaktualizujPrzyciskLatarki(torchState);
          return;
        }
      } catch (e) {}
    }

    if (!track) { alert("Aparat nie jest aktywny."); return; }
    try {
      torchState = !torchState;
      await track.applyConstraints({ advanced: [{ torch: torchState }] });
      zaktualizujPrzyciskLatarki(torchState);
    } catch (err) {}
  }

  function zaktualizujPrzyciskLatarki(stan) {
    const btn = document.getElementById('btn-torch');
    if (btn) {
      btn.innerText = stan ? "🔦 Wyłącz latarkę" : "🔦 Włącz latarkę";
      btn.className = stan ? "btn btn-outline-warning w-100 mb-3 fw-bold text-white" : "btn btn-warning w-100 mb-3 fw-bold";
    }
  }
  
  async function uruchomNatywnySkaner(containerId, onSuccessCallback) {
    const container = document.getElementById(containerId);
    container.innerHTML = "";
    const video = document.createElement('video');
    video.setAttribute('playsinline', 'true');
    container.appendChild(video);
    activeVideoElement = video;

    try {
      activeStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      video.srcObject = activeStream;
      await video.play();

      const track = activeStream.getVideoTracks()[0];
      if (track && track.getCapabilities && track.getCapabilities().torch) {
        document.getElementById('btn-torch').classList.remove('d-none');
      }

      const barcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });

      scanInterval = setInterval(async () => {
        if (blokadaSkanera || !video.videoWidth) return;
        try {
          const barcodes = await barcodeDetector.detect(video);
          if (barcodes.length > 0) { onSuccessCallback(barcodes[0].rawValue); }
        } catch (e) {}
      }, 100);

    } catch (err) {
      uruchomFallbackQrcode(containerId, onSuccessCallback);
    }
  }

  function zatrzymajNatywnySkaner() {
    if (scanInterval) { clearInterval(scanInterval); scanInterval = null; }
    if (activeStream) {
      activeStream.getTracks().forEach(track => track.stop());
      activeStream = null;
    }
    if (activeVideoElement) {
      activeVideoElement.remove();
      activeVideoElement = null;
    }
    torchState = false;
    const btnTorch = document.getElementById('btn-torch');
    if (btnTorch) {
      btnTorch.innerText = "🔦 Włącz latarkę";
      btnTorch.className = "btn btn-warning w-100 mb-3 fw-bold d-none";
    }
  }

  function uruchomFallbackQrcode(containerId, onSuccessCallback) {
    document.getElementById('btn-torch').classList.remove('d-none');
    if (containerId === 'reader') {
      html5Qrcode = new Html5Qrcode("reader");
      html5Qrcode.start({ facingMode: "environment" }, { fps: 20, qrbox: 250 }, (text) => onSuccessCallback(text), () => {});
    } else {
      loginQrcode = new Html5Qrcode("login-reader");
      loginQrcode.start({ facingMode: "environment" }, { fps: 20, qrbox: 220 }, (text) => onSuccessCallback(text), () => {});
    }
  }

  function odpalSkanerLogowania() {
    const box = document.getElementById('login-reader');
    box.style.display = 'block';

    const onLoginSuccess = (decodedText) => {
      document.getElementById('auth-email').value = decodedText.trim().toLowerCase();
      schowajAparat();
      box.style.display = 'none';
      document.getElementById('auth-password').focus();
    };

    if (hasNativeBarcodeDetector) { uruchomNatywnySkaner('login-reader', onLoginSuccess); } 
    else { uruchomFallbackQrcode('login-reader', onLoginSuccess); }
  }

  function autoryzujZBazą() {
    const email = document.getElementById('auth-email').value.trim().toLowerCase();
    const haslo = document.getElementById('auth-password').value.trim();
    const btn = document.getElementById('btn-login-submit');
    
    if (email.length < 3 || haslo.length === 0) { alert("Wpisz e-mail oraz hasło."); return; }
    
    btn.disabled = true;
    btn.innerText = "Weryfikacja danych...";

    const paczkaDanych = { akcja: "weryfikuj_user", email: email, haslo: haslo };

    fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams(paczkaDanych).toString()
    })
    .then(res => res.text())
    .then(odpowiedz => {
      btn.disabled = false;
      btn.innerText = "Zaloguj do systemu";
      
      if (odpowiedz.startsWith("DOZWOLONY")) {
        const nazwaPracownika = odpowiedz.split('|')[1];
        localStorage.setItem('wms_user_email', email);
        localStorage.setItem('wms_user_name', nazwaPracownika);
        zalogowanyUzytkownik = email;
        
        document.getElementById('user-badge').innerText = nazwaPracownika;
        document.getElementById('login-overlay').style.display = 'none';
        
        schowajAparat();
        setTimeout(() => { aktywujSkanowanie('kod-towaru'); }, 500);
      } else { alert("❌ Błąd: Niepoprawny e-mail lub hasło!"); }
    })
    .catch(err => { alert("Błąd połączenia z serwerem weryfikacji."); btn.disabled = false; btn.innerText = "Zaloguj do systemu"; });
  }

  function wylogujOperatora() {
    localStorage.removeItem('wms_user_email');
    localStorage.removeItem('wms_user_name');
    zalogowanyUzytkownik = "";
    document.getElementById('login-overlay').style.display = 'flex';
    document.getElementById('auth-email').value = "";
    document.getElementById('auth-password').value = "";
    schowajAparat();
  }

  function wyczyscPole(id) { document.getElementById(id).value = ""; document.getElementById(id).focus(); }

  function aktywujSkanowanie(poleId) {
    document.getElementById('aktywne-pole').value = poleId;
    document.getElementById('kod-towaru').classList.remove('skan-aktywny');
    document.getElementById('polka').classList.remove('skan-aktywny');
    document.getElementById('polka-do').classList.remove('skan-aktywny');
    document.getElementById('pracownik').classList.remove('skan-aktywny');
    const inputDuplikat = document.getElementById('p-duplikat-kod');
    if(inputDuplikat) inputDuplikat.classList.remove('skan-aktywny');

    const el = document.getElementById(poleId);
    if(el) el.classList.add('skan-aktywny');
    
    document.getElementById('instrukcja-skanu').classList.remove('d-none');
    document.getElementById('reader').style.display = 'block';

    let trybOperacji = document.getElementById('operacja').value;

    if(poleId === 'kod-towaru') {
      document.getElementById('instrukcja-skanu').innerText = "📷 KROK 1: Zeskanuj kod QR PRODUKTU";
      document.getElementById('instrukcja-skanu').className = "alert alert-warning text-center fw-bold small text-dark";
    } else if(poleId === 'polka') {
      document.getElementById('instrukcja-skanu').innerText = "📍 KROK 2: Zeskanuj kod QR PÓŁKI (ŹRÓDŁOWA)";
      document.getElementById('instrukcja-skanu').className = "alert alert-info text-center fw-bold small text-dark";
    } else if(poleId === 'polka-do') {
      document.getElementById('instrukcja-skanu').innerText = "📍 KROK 2b: Zeskanuj kod QR PÓŁKI DOCELOWEJ";
      document.getElementById('instrukcja-skanu').className = "alert alert-primary text-center fw-bold small text-white bg-primary";
    } else if(poleId === 'p-duplikat-kod') {
      document.getElementById('instrukcja-skanu').innerText = "📋 Zeskanuj dowolną etykietę do duplikatu";
      document.getElementById('instrukcja-skanu').className = "alert alert-warning text-center fw-bold small text-dark";
    } else {
      document.getElementById('instrukcja-skanu').innerText = "🪪 KROK 3: Zeskanuj kod QR PRACOWNIKA";
      document.getElementById('instrukcja-skanu').className = "alert alert-danger text-center fw-bold small text-white bg-danger";
    }

    const onScanSuccess = (decodedText) => {
      if (blokadaSkanera) return;
      blokadaSkanera = true;
      let celInput = document.getElementById('aktywne-pole').value;
      const inputTarget = document.getElementById(celInput);
      if(inputTarget) {
        inputTarget.value = decodedText;
        inputTarget.classList.remove('skan-aktywny');
      }
      
      wstrzymajAparat().then(() => {
        setTimeout(() => { blokadaSkanera = false; }, 1500); 
        let tryb = document.getElementById('operacja').value;
        
        if (celInput === 'p-duplikat-kod') {
          schowajAparat();
        } else if (celInput === 'kod-towaru') {
          aktywujSkanowanie('polka');
        } else if (celInput === 'polka' && tryb === 'Przesunięcie') {
          aktywujSkanowanie('polka-do');
        } else if (celInput === 'polka' && tryb === 'Wydanie Regał') {
          schowajAparat();
          document.getElementById('strefa-select').focus();
        } else if (celInput === 'polka' && tryb === 'Wydanie Osoba') {
          aktywujSkanowanie('pracownik');
        } else {
          schowajAparat();
          document.getElementById('ilosc').focus();
          document.getElementById('ilosc').select();
        }
      });
    };

    if (hasNativeBarcodeDetector) { uruchomNatywnySkaner('reader', onScanSuccess); } 
    else { uruchomFallbackQrcode('reader', onScanSuccess); }
  }

  function wstrzymajAparat() { 
    zatrzymajNatywnySkaner();
    if (html5Qrcode && html5Qrcode.isScanning) { return html5Qrcode.stop(); } 
    if (loginQrcode && loginQrcode.isScanning) { return loginQrcode.stop(); }
    return Promise.resolve(); 
  }

  function schowajAparat() { 
    wstrzymajAparat().then(() => { 
      document.getElementById('reader').style.display = 'none'; 
      document.getElementById('login-reader').style.display = 'none'; 
      document.getElementById('instrukcja-skanu').classList.add('d-none'); 
      document.getElementById('kod-towaru').classList.remove('skan-aktywny'); 
      document.getElementById('polka').classList.remove('skan-aktywny'); 
      document.getElementById('polka-do').classList.remove('skan-aktywny'); 
      document.getElementById('pracownik').classList.remove('skan-aktywny'); 
      const inputDuplikat = document.getElementById('p-duplikat-kod');
      if(inputDuplikat) inputDuplikat.classList.remove('skan-aktywny');
    }); 
  }

  function ustawTryb(tryb) {
    document.getElementById('operacja').value = tryb;
    const sekcjaPracownik = document.getElementById('sekcja-pracownik');
    const sekcjaPolkaDo = document.getElementById('sekcja-polka-do');
    const sekcjaListaStref = document.getElementById('sekcja-lista-stref');
    const labelPolkaZ = document.getElementById('label-polka-z');
    const inputPolkaDo = document.getElementById('polka-do');
    const inputPracownik = document.getElementById('pracownik');
    const selectStrefa = document.getElementById('strefa-select');

    if (tryb === 'Przyjęcie') {
      sekcjaPracownik.style.display = 'none';
      sekcjaPolkaDo.style.display = 'none';
      sekcjaListaStref.style.display = 'none';
      labelPolkaZ.innerText = "2. ADRES PÓŁKI (DOCELOWA):";
      inputPracownik.removeAttribute('required');
      inputPolkaDo.removeAttribute('required');
      selectStrefa.removeAttribute('required');

    } else if (tryb === 'Przesunięcie') {
      sekcjaPracownik.style.display = 'none';
      sekcjaPolkaDo.style.display = 'block';
      sekcjaListaStref.style.display = 'none';
      labelPolkaZ.innerText = "2a. PÓŁKA ŹRÓDŁOWA (Z):";
      inputPracownik.removeAttribute('required');
      selectStrefa.removeAttribute('required');
      inputPolkaDo.setAttribute('required', 'true');

    } else if (tryb === 'Wydanie Regał') {
      sekcjaPracownik.style.display = 'none';
      sekcjaPolkaDo.style.display = 'none';
      sekcjaListaStref.style.display = 'block';
      labelPolkaZ.innerText = "2a. PÓŁKA ŹRÓDŁOWA (Z):";
      inputPracownik.removeAttribute('required');
      inputPolkaDo.removeAttribute('required');
      selectStrefa.setAttribute('required', 'true');

    } else { // Wydanie Osoba
      sekcjaPracownik.style.display = 'block';
      sekcjaPolkaDo.style.display = 'none';
      sekcjaListaStref.style.display = 'none';
      labelPolkaZ.innerText = "2. ADRES PÓŁKI (ŹRÓDŁOWA):";
      inputPracownik.setAttribute('required', 'true');
      inputPolkaDo.removeAttribute('required');
      selectStrefa.removeAttribute('required');
    }
    setTimeout(() => { aktywujSkanowanie('kod-towaru'); }, 100);
  }

  function wyslijDane(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-submit');
    const statusBox = document.getElementById('status');
    btn.disabled = true;
    btn.innerText = "Zapisywanie w chmurze...";

    let tryb = document.getElementById('operacja').value;
    let polkaValue = document.getElementById('polka').value.trim();
    let polkaDoValue = document.getElementById('polka-do').value.trim();
    let wybranaStrefa = document.getElementById('strefa-select').value;
    
    let surowaNazwa = localStorage.getItem('wms_user_name') || zalogowanyUzytkownik || "";
    if (surowaNazwa.indexOf("@") !== -1) { surowaNazwa = surowaNazwa.split("@")[0]; }
    let czystaNazwa = surowaNazwa.replace(/[\._-]/g, " ").trim();
    let sformatowanyOperator = czystaNazwa.split(" ").map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(" ");

    let zLok = "";
    let doLok = "";
    let pracownikValue = "";

    if (tryb === "Wydanie Osoba") {
      zLok = polkaValue;
      doLok = "PRODUKCJA";
      pracownikValue = document.getElementById('pracownik').value.trim();
    } else if (tryb === "Przyjęcie") {
      zLok = "DOSTAWCA";
      doLok = polkaValue;
      pracownikValue = sformatowanyOperator;
    } else if (tryb === "Przesunięcie") {
      zLok = polkaValue;
      doLok = polkaDoValue;
      pracownikValue = sformatowanyOperator;
    } else if (tryb === "Wydanie Regał") {
      zLok = polkaValue;
      doLok = wybranaStrefa;
      pracownikValue = wybranaStrefa;
    }

    const paczkaDanych = {
      akcja: "zapis_ruchu",
      typ: tryb.toUpperCase(),
      Z_Lokalizacji: zLok,
      Do_Lokalizacji: doLok,
      towar: document.getElementById('kod-towaru').value.trim(),
      pracownik: pracownikValue,
      ilosc: document.getElementById('ilosc').value,
      operator: zalogowanyUzytkownik
    };

    fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams(paczkaDanych).toString()
    })
    .then(res => res.json())
    .then(data => {
      btn.disabled = false;
      btn.innerText = "ZAPISZ OPERACJĘ (Enter)";
      if(data.status === "SUCCESS") {
        statusBox.innerText = "🚀 ZAPISANO OPERACJĘ: " + data.id_ruchu;
        statusBox.className = "alert alert-success mt-3 text-center fw-bold bg-success text-white border-0";
        statusBox.classList.remove('d-none');
        
        document.getElementById('kod-towaru').value = "";
        document.getElementById('polka').value = "";
        document.getElementById('polka-do').value = "";
        document.getElementById('pracownik').value = "";
        document.getElementById('strefa-select').value = "";
        document.getElementById('ilosc').value = '1';
        
        setTimeout(() => { 
          statusBox.classList.add('d-none'); 
          wstrzymajAparat().then(() => { aktywujSkanowanie('kod-towaru'); }); 
        }, 1500);
      } else {
        alert("Błąd walidacji lub chmury:\n" + data.message);
      }
    })
    .catch(err => { 
      alert("Błąd połączenia z bazą danych."); 
      btn.disabled = false; 
      btn.innerText = "ZAPISZ OPERACJĘ (Enter)";
    });
  }
